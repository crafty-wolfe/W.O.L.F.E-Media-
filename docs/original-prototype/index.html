<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>W.O.L.F.E Media</title>
<style>
:root{--bg:#03070d;--panel:#0a111c;--panel2:#101c2b;--ink:#f6fbff;--muted:#8fa2b7;--blue:#20a9ff;--cyan:#7bdcff;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:var(--ink);font-family:Segoe UI,Arial,sans-serif}button{font:inherit}.shell{height:100%;padding:22px 30px 52px;background:radial-gradient(circle at 15% 0,rgba(25,91,148,.26),transparent 36%),radial-gradient(circle at 85% 30%,rgba(16,72,122,.18),transparent 35%),linear-gradient(#080d15,#03070d 72%,#02050a)}.top{height:68px;display:grid;grid-template-columns:240px 1fr 230px;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#14689e,#071b2c);box-shadow:0 0 0 1px rgba(123,220,255,.25),0 10px 28px rgba(0,120,255,.2)}.bt{font-weight:900;letter-spacing:.15em}.bs{font-size:10px;letter-spacing:.33em;color:var(--cyan)}nav{display:flex;justify-content:center;gap:6px;white-space:nowrap}.nav{border:0;background:transparent;color:#a8b7c6;padding:10px 12px;border-radius:11px;cursor:pointer}.nav.active{background:rgba(32,169,255,.13);color:#fff}.status{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:#c7d2df;font-size:14px}.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:7px 10px;border-radius:999px;cursor:pointer}.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#1f8fff,#7b3cff)}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}.content{height:calc(100% - 68px);overflow:hidden}.hero{height:42%;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;padding:28px 0 18px}.heroCopy{display:flex;flex-direction:column;justify-content:center;max-width:720px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--cyan)}h1{font-size:48px;line-height:1.02;margin:7px 0 10px;letter-spacing:-.035em}.hero p,.lead{color:#9eb0c2;font-size:16px;line-height:1.5}.actions{display:flex;gap:10px}.primary,.secondary{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#07111b}.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}.heroArt{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,transparent 0 55%,rgba(2,5,10,.88) 100%),radial-gradient(circle at 68% 30%,rgba(164,200,235,.25),transparent 10%),linear-gradient(160deg,#19324a,#0b1725 48%,#08101a);box-shadow:0 18px 60px rgba(0,0,0,.3)}.heroArt:after{content:'';position:absolute;left:8%;right:8%;bottom:-10%;height:76%;background:linear-gradient(135deg,transparent 0 26%,#173146 27% 47%,transparent 48%),linear-gradient(225deg,transparent 0 30%,#0d1d2a 31% 54%,transparent 55%)}.rows{height:58%;overflow:hidden}.row{margin-bottom:15px}.rowTitle{font-size:18px;font-weight:850;margin-bottom:8px}.cards{display:flex;gap:13px;padding:3px}.card{width:215px;min-width:215px;height:116px;border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#19304a,#0a111b);cursor:pointer;color:#fff;text-align:left}.card:nth-child(2n){background:linear-gradient(135deg,#382c49,#0d111c)}.card:nth-child(3n){background:linear-gradient(135deg,#443225,#0b1118)}.shade{position:absolute;inset:32% 0 0;background:linear-gradient(transparent,rgba(1,3,7,.96))}.meta{position:absolute;left:12px;right:12px;bottom:10px}.title{font-weight:850}.small{font-size:11px;color:#aab8c6;margin-top:3px}.progress{height:3px;background:rgba(255,255,255,.16);margin-top:6px;border-radius:4px}.progress span{display:block;height:100%;background:var(--blue)}.page{height:100%;padding-top:24px}.page h1{font-size:36px;margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}.tile{min-height:150px;border:1px solid var(--line);border-radius:19px;padding:18px;background:linear-gradient(145deg,#0f1b2a,#070c13);color:#fff;text-align:left;cursor:pointer}.tile .icon{font-size:28px}.tile h3{font-size:20px;margin:25px 0 6px}.tile p{color:#8ea0b4;font-size:13px;line-height:1.45;margin:0}.footer{position:absolute;left:30px;right:30px;bottom:14px;display:flex;gap:20px;color:#6d8196;font-size:12px}.focusable:focus{outline:none;box-shadow:0 0 0 3px rgba(32,169,255,.95),0 0 32px rgba(32,169,255,.35);transform:translateY(-2px)}.overlay,.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,5,10,.8);backdrop-filter:blur(16px)}.hidden{display:none!important}.profiles{width:min(1000px,90vw);text-align:center}.profiles h1{margin:6px 0 8px}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.profile{border:1px solid var(--line);border-radius:22px;padding:24px;background:linear-gradient(145deg,#0e1826,#070c13);color:#fff;cursor:pointer}.big{width:82px;height:82px;margin:0 auto 12px;font-size:26px}.profile h3{margin:0}.profile small{color:#8699ad}.camera{position:fixed;right:26px;bottom:68px;z-index:30;width:440px;border:1px solid rgba(123,220,255,.2);border-radius:22px;overflow:hidden;background:#07111c;display:grid;grid-template-columns:45% 55%;box-shadow:0 20px 70px rgba(0,0,0,.6),0 0 35px rgba(32,169,255,.15)}.camView{min-height:210px;position:relative;background:linear-gradient(#173149,#08111a)}.camView:after{content:'';position:absolute;left:18px;right:18px;bottom:45px;height:78px;background:#1e394e;box-shadow:0 50px 0 #162532}.person{position:absolute;width:12px;height:40px;background:#c3d4de;border-radius:6px;left:58%;bottom:38px;z-index:2}.live{position:absolute;left:10px;top:10px;font-size:10px;font-weight:900;color:#b9efff;z-index:3}.camCopy{padding:20px}.camCopy h3{margin:7px 0}.camCopy p{color:#8ca0b4;margin:0 0 18px}.modalCard{width:min(640px,90vw);border:1px solid var(--line);border-radius:24px;padding:26px;background:linear-gradient(145deg,#0e1825,#070b12);box-shadow:0 25px 80px rgba(0,0,0,.5)}.modalCard h2{font-size:30px;margin:8px 0}.modalCard p{color:#9bacc0;line-height:1.55}.slot{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:rgba(255,255,255,.025)}.slot span{color:#8296aa}.lite .nav[data-tab='movies'],.lite .nav[data-tab='series'],.lite .nav[data-tab='kids'],.lite .nav[data-tab='homecontrol']{display:none}.lite .hero{height:38%}.lite .rows{height:62%}.lite h1{font-size:42px}@media(max-width:1200px){.top{grid-template-columns:200px 1fr 180px}.nav{padding:9px 8px;font-size:13px}.card{width:190px;min-width:190px}}
</style></head><body><div id='shell' class='shell'><header class='top'><div class='brand'><div class='mark'>W</div><div><div class='bt'>W.O.L.F.E</div><div id='modeText' class='bs'>MEDIA</div></div></div><nav id='nav'></nav><div class='status'><div id='profileChip' class='chip focusable' tabindex='0'><div id='profileInitial' class='avatar'>M</div><span id='profileName'>Mike</span></div><div class='dot'></div><span id='clock'></span></div></header><main id='content' class='content'></main><div class='footer'><span><b>← ↑ ↓ →</b> Navigate</span><span><b>Enter</b> Select</span><span><b>Esc</b> Back</span><span><b>C</b> Camera alert</span><span><b>I</b> IPTV demo</span></div></div>
<div id='profileOverlay' class='overlay hidden'><div class='profiles'><div class='eyebrow'>W.O.L.F.E MEDIA</div><h1>Who's watching?</h1><p class='lead'>Choose a profile. W.O.L.F.E remembers each person's progress separately.</p><div id='profileGrid' class='profileGrid'></div></div></div>
<div id='camera' class='camera hidden'><div class='camView'><div class='live'>● LIVE</div><div class='person'></div></div><div class='camCopy'><div class='eyebrow'>PERSON DETECTED</div><h3>Driveway camera</h3><p>Motion detected just now.</p><div class='actions'><button id='viewCam' class='primary focusable'>View</button><button id='dismissCam' class='secondary focusable'>Dismiss</button></div></div></div>
<div id='modal' class='modal hidden'><div class='modalCard'><div id='modalEyebrow' class='eyebrow'>W.O.L.F.E</div><h2 id='modalTitle'>Title</h2><div id='modalBody'></div><div id='modalActions' class='actions'></div></div></div>
<script>
const qs=new URLSearchParams(location.search),mode=(qs.get('mode')||'main').toLowerCase();if(mode==='lite')document.body.classList.add('lite');document.getElementById('modeText').textContent=mode==='lite'?'MEDIA LITE':'MEDIA';
const tabs=[['home','Home'],['ondemand','On Demand'],['movies','Movies'],['series','Series'],['kids','Kids'],['cameras','Cameras'],['homecontrol','Home'],['apps','Apps']];const nav=document.getElementById('nav');tabs.forEach(([id,label])=>{const b=document.createElement('button');b.className='nav focusable'+(id==='home'?' active':'');b.dataset.tab=id;b.textContent=label;b.onclick=()=>{app.tab=id;render();focusFirst()};nav.appendChild(b)});
const profiles=[['Mike','M','Main profile'],['Amy','A','Mum'],['Alfie','A','Oldest boy'],['Brooke','B','Middle child'],['Elsie-Joan','EJ','Youngest girl'],['Visitors','V','On-demand only']];const watch={Mike:[['The Night Run','S1 E4 · 42m',68],['Beyond Tomorrow','S2 E3 · 25m',31],['Wilderness','S3 E4 · 17m',54],['Velocity','Film · 1h 52m',22]],Amy:[['The Long Weekend','S1 E6 · 19m',44],['Harbour Lights','S2 E1 · 8m',18],['Wild North','Film · 2h 04m',76],['Kitchen Stories','S4 E3 · 29m',62]],Alfie:[['Velocity X','S1 E8 · 14m',71],['Goal Line','S3 E2 · 26m',34],['Neon City','Film · 1h 45m',48],['Rivals','S2 E5 · 11m',25]],Brooke:[['Starlight High','S2 E4 · 21m',57],['Dance Crew','S1 E7 · 16m',43],['Summer House','Film · 1h 36m',28],['Wild Hearts','S3 E2 · 9m',16]],'Elsie-Joan':[['Little Explorers','S1 E5 · 7m',63],['Happy Farm','S2 E1 · 10m',29],['Magic Garden','S1 E8 · 3m',74],['Bedtime Tales','S4 E2 · 5m',36]],Visitors:[['Featured Movies','On demand',0],['Box Sets','On demand',0],['Family Picks','On demand',0],['Recently Added','On demand',0]]};let app={tab:'home',profile:localStorage.getItem('wolfe_profile')||'Mike'};const $=id=>document.getElementById(id);function clock(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,10000);
function profileUI(){const p=profiles.find(x=>x[0]===app.profile);$('profileName').textContent=p[0];$('profileInitial').textContent=p[1]};function showProfiles(){const g=$('profileGrid');g.innerHTML='';profiles.forEach(p=>{const b=document.createElement('button');b.className='profile focusable';b.innerHTML=`<div class='avatar big'>${p[1]}</div><h3>${p[0]}</h3><small>${p[2]}</small>`;b.onclick=()=>{app.profile=p[0];localStorage.setItem('wolfe_profile',p[0]);$('profileOverlay').classList.add('hidden');render();focusFirst()};g.appendChild(b)});$('profileOverlay').classList.remove('hidden');setTimeout(()=>g.querySelector('.focusable')?.focus(),30)};$('profileChip').onclick=showProfiles;$('profileChip').onkeydown=e=>{if(e.key==='Enter')showProfiles()};
function card(i){return `<button class='card focusable' onclick="details('${i[0].replaceAll("'","\\'")}')"><div class='shade'></div><div class='meta'><div class='title'>${i[0]}</div><div class='small'>${i[1]}</div>${i[2]?`<div class='progress'><span style='width:${i[2]}%'></span></div>`:''}</div></button>`}function row(title,items){return `<section class='row'><div class='rowTitle'>${title}</div><div class='cards'>${items.map(card).join('')}</div></section>`}
function home(){const hero=app.profile==='Elsie-Joan'?'Magic Garden':app.profile==='Brooke'?'Starlight High':'Beyond Tomorrow';$('content').innerHTML=`<section class='hero'><div class='heroCopy'><div class='eyebrow'>${mode==='lite'?'Your room · ready to watch':'Featured tonight'}</div><h1>${hero}</h1><p>Continue where you left off, discover something new, or jump straight into your favourite services.</p><div class='actions'><button class='primary focusable' onclick='playDemo()'>▶ Play</button><button class='secondary focusable' onclick="details('${hero}')">More info</button></div></div><div class='heroArt'></div></section><div class='rows'>${row('Continue Watching',watch[app.profile])}${row('Recommended for you',[['Night Shift','Drama · 2026',0],['Coastal Road','Film · 2025',0],['Zero Hour','Thriller · 2026',0],['Wild Earth','Documentary',0]])}${row('Quick access',[['Netflix','Streaming',0],['Prime Video','Streaming',0],['Disney+','Streaming',0],['IPTV On Demand','2 connections',0],['YouTube','Streaming',0]])}</div>`}
function page(title,sub,items){$('content').innerHTML=`<section class='page'><div class='eyebrow'>W.O.L.F.E MEDIA</div><h1>${title}</h1><p class='lead'>${sub}</p><div class='grid'>${items.map(x=>`<button class='tile focusable' onclick="${x[3]||`details('${x[1]}')`}"><div class='icon'>${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}</div></section>`}
function ondemand(){page('On Demand','Films and box sets first — live TV stays out of the way.',[['🎬','Featured Films','Curated films and recently added titles.'],['📺','Box Sets','Browse series by genre, season and popularity.'],['🕘','Continue Watching','Pick up exactly where you left off.'],['★','Favourites','Your saved films and series.'],['🔎','Search','Find something across your on-demand library.'],['⚡','IPTV connection demo','Show the two-connection protection screen.','showIptv()']])}function movies(){page('Movies','A simple, remote-friendly movie library.',[['🔥','Popular','Popular films right now.'],['✨','Recently Added','Fresh additions.'],['💥','Action','Action and adventure.'],['😂','Comedy','Comedy picks.'],['👨‍👩‍👧‍👦','Family','Family-friendly favourites.'],['🧭','Browse All','Explore the complete catalogue.']])}function series(){page('Series & Box Sets','Long-form viewing with easy progress tracking.',[['▶','Continue Series','Resume the next episode.'],['📈','Trending','Popular box sets.'],['🆕','Recently Added','New seasons and series.'],['🎭','Drama','Drama and thrillers.'],['🌍','Documentary','Factual series.'],['⭐','My Favourites','Saved series for this profile.']])}function kids(){page('Kids','A cleaner, simpler area for younger viewers.',[['🌈','Little Explorers','Bright, gentle shows.'],['🐻','Favourites','Most watched kids programmes.'],['🎓','Learning','Educational content.'],['🎵','Music & Songs','Sing-alongs and music.'],['🛏️','Bedtime','Calmer programmes.'],['👨‍👩‍👧','Family Movies','Films for everyone.']])}function cameras(){page('Cameras','Prototype camera controls. Tapo/Home Assistant will connect later.',[['📷','Driveway','View a simulated live feed.','showCamera()'],['🚪','Front Door','Entrance camera.'],['🌳','Garden','Rear garden camera.'],['🧱','Side Access','Side path / gate.'],['⚡','Simulate Person Alert','Show the corner popup.','showCamera()'],['🕘','Recent Events','Events will appear here later.']])}function homecontrol(){page('Home Control','Inactive until the Home Assistant hub is installed.',[['🌡️','Living Room','Temperature and lights placeholder.'],['🍳','Kitchen','Temperature and lights placeholder.'],['🚪','Hallway','Temperature and lights placeholder.'],['🛏️','Main Bedroom','Temperature and lights placeholder.'],['🧒','Children’s Rooms','Room controls placeholder.'],['⚙️','Routines','Home Assistant routines later.']])}function apps(){page('Apps','Core family services in one place.',[['N','Netflix','Open Netflix.','window.open("https://www.netflix.com","_blank")'],['P','Prime Video','Amazon Prime Video.','window.open("https://www.primevideo.com","_blank")'],['D+','Disney+','Open Disney+.','window.open("https://www.disneyplus.com","_blank")'],['▶','YouTube','Open YouTube.','window.open("https://www.youtube.com","_blank")'],['IP','IPTV On Demand','Prototype VOD library.','app.tab="ondemand";render()'],['👤','Change Profile','Who’s watching?','showProfiles()']])}
function render(){profileUI();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===app.tab));({home,ondemand,movies,series,kids,cameras,homecontrol,apps}[app.tab]||home)()};function modal(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=buttons;$('modal').classList.remove('hidden');setTimeout(()=>$('modalActions').querySelector('.focusable')?.focus(),30)}function closeModal(){$('modal').classList.add('hidden');focusFirst()}function details(t){modal(t,`<p>Prototype detail page for <b>${t}</b>. The finished version can show synopsis, artwork, season/episode details, service source and saved progress.</p>`,`<button class='secondary focusable' onclick='closeModal()'>Back</button><button class='primary focusable' onclick='playDemo()'>▶ Play</button>`)}function playDemo(){localStorage.setItem('wolfe_demo_'+app.profile,Date.now());modal('Playback started',`<p>This prototype does not bundle copyrighted media. W.O.L.F.E has saved demo progress locally for <b>${app.profile}</b>.</p>`,`<button class='primary focusable' onclick='closeModal()'>Back</button>`)}function showIptv(){modal('Both IPTV connections are in use',`<p>Your subscription allows two simultaneous IPTV streams.</p><div class='slot'><div><b>Living Room</b><br><span>Beyond Tomorrow</span></div><span>Connection 1</span></div><div class='slot'><div><b>Alfie’s Room</b><br><span>Velocity X</span></div><span>Connection 2</span></div>`,`<button class='secondary focusable' onclick='closeModal()'>Cancel</button><button class='secondary focusable' onclick='release("Living Room")'>Stop Living Room</button><button class='primary focusable' onclick='release("Alfie’s Room")'>Stop Alfie’s Room</button>`)}function release(r){modal(r+' released',`<p>The prototype has released that IPTV slot. This TV could now start playback.</p>`,`<button class='primary focusable' onclick='closeModal()'>Done</button>`)}function showCamera(){$('camera').classList.remove('hidden');setTimeout(()=>$('viewCam').focus(),30)}function hideCamera(){$('camera').classList.add('hidden');focusFirst()}$('dismissCam').onclick=hideCamera;$('viewCam').onclick=()=>{hideCamera();app.tab='cameras';render()};
function focusables(){return [...document.querySelectorAll('.focusable')].filter(el=>!el.closest('.hidden')&&getComputedStyle(el).display!=='none')}function focusFirst(){const a=focusables();if(!a.includes(document.activeElement))(document.querySelector('.nav.active')||a[0])?.focus()}document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c'){showCamera();return}if(e.key.toLowerCase()==='i'){showIptv();return}if(e.key==='Escape'){if(!$('profileOverlay').classList.contains('hidden')){$('profileOverlay').classList.add('hidden');focusFirst();return}if(!$('camera').classList.contains('hidden')){hideCamera();return}if(!$('modal').classList.contains('hidden')){closeModal();return}if(app.tab!=='home'){app.tab='home';render();focusFirst();return}}if(!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key))return;const cur=document.activeElement,all=focusables();if(!all.includes(cur)){all[0]?.focus();return}e.preventDefault();const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,score=1e9;all.forEach(el=>{if(el===cur)return;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;let ok=e.key==='ArrowRight'?dx>12:e.key==='ArrowLeft'?dx<-12:e.key==='ArrowDown'?dy>12:dy<-12;if(!ok)return;const p=(e.key==='ArrowRight'||e.key==='ArrowLeft')?Math.abs(dx):Math.abs(dy),s=(e.key==='ArrowRight'||e.key==='ArrowLeft')?Math.abs(dy):Math.abs(dx),sc=p+s*1.8;if(sc<score){score=sc;best=el}});best?.focus()});window.showProfiles=showProfiles;window.showCamera=showCamera;window.showIptv=showIptv;window.closeModal=closeModal;window.details=details;window.playDemo=playDemo;window.release=release;if(!localStorage.getItem('wolfe_seen')){localStorage.setItem('wolfe_seen','1');setTimeout(showProfiles,200)}render();setTimeout(focusFirst,100);
</script></body></html>
